# Single source of truth for every adapter's candidate-batch tensor shape - read by both
# scripts/generate_dummy_model.py (Phase 6, to compute the trivial ONNX model's declared input
# shape) and the C++ adapters (DummyAdapter now, SarlAdapter in Phase 8) at construction time.
# speed_samples/rotation_samples/
# time_step_s are verified directly against the pinned checkpoint's own
# crowd_nav/configs/policy.config [action_space] and env.config [env] sections, not memorized.

# Candidate action space (cadrl.py's build_action_space/propagate, kinematics=holonomic).
# candidate count = speed_samples * rotation_samples + 1 (the +1 is the stop action).
speed_samples: 5
rotation_samples: 16
time_step_s: 0.25

# Observation shape (crowd_nav_observation::ObservationBuilder, Phase 5) each candidate is
# built through. feature_dim = 9 + 5 * max_humans.
max_humans: 5
human_radius_m: 0.3

# Robot self-state constants fed to the network (RobotSelfState::radius/v_pref) - matched to
# CrowdNav's training distribution (S4.3's policy_radius/robot_radius split), not the real
# robot's physical size/speed. Added v1.13 (Phase 7) so the controller plugin (now) and
# SarlAdapter (Phase 8) share one source instead of each hand-typing these separately.
policy_radius_m: 0.3
policy_v_pref_mps: 1.0

# SarlAdapter's discount factor (multi_human_rl.py's predict(): reward + gamma^(time_step*
# v_pref) * network_value) - the checkpoint's own policy.config [rl] section, not a default.
# Added v1.15 (Phase 8).
sarl_gamma: 0.9
