amcl:
  ros__parameters:
    use_sim_time: true
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    global_frame_id: "map"
    odom_frame_id: "odom"
    scan_topic: scan
    # Reduced ~180deg FOV (IMPLEMENTATION_PLAN.md Phase 1/2): weaker rotational constraint on
    # scan matching than 360deg would give. Given a good initial pose (set below) rather than
    # relying on global localization, more particles than the Nav2 default (500/2000) buys
    # extra margin against the multi-modal distributions a repeating-shelf-bay layout can
    # produce even from a decent starting estimate.
    min_particles: 500
    max_particles: 3000
    laser_max_range: 8.0
    laser_min_range: 0.12
    laser_model_type: "likelihood_field"
    # initial_pose is in MAP frame, not world frame - a real bug hit here (2026-07-22, see
    # docs/phase2-findings.md): map frame's origin coincides with wherever SLAM/localization
    # considered its own start, which is the robot's spawn pose. Since we spawn at world
    # (-3.0, 0.0, yaw=0) and that IS where mapping started, the map-frame initial pose is
    # (0, 0, 0), not (-3.0, 0.0, 0) - do not conflate the two coordinate frames again.
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
    always_reset_initial_pose: false
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    update_min_d: 0.1
    update_min_a: 0.1
    resample_interval: 1
    transform_tolerance: 1.0
    recovery_alpha_slow: 0.001
    recovery_alpha_fast: 0.1

amcl_map_client:
  ros__parameters:
    use_sim_time: true

amcl_rclcpp_node:
  ros__parameters:
    use_sim_time: true

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /diff_drive_base_controller/odom
    default_nav_to_pose_bt_xml: ""
    default_nav_through_poses_bt_xml: ""

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.05
      movement_time_allowance: 15.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      # Loosened from 0.1, then from 0.2, after a real failure mode found in Phase 2 testing
      # (see docs/phase2-findings.md): the robot would repeatedly close to within some tens of
      # cm of the goal, then NavFn would fail planning the remaining short hop (a known NavFn
      # degenerate-short-path issue), triggering repeated "Failed to make progress" aborts and
      # recovery-behavior loops that never converged - the robot never got a chance to be
      # declared "close enough" before the last-mile replan attempt failed. Reproduced again at
      # a stop distance of ~0.3 m (beyond the previous 0.2 tolerance), so 0.3 keeps the goal
      # checker ahead of that failure mode with a bit more margin.
      xy_goal_tolerance: 0.3
      yaw_goal_tolerance: 0.15
      stateful: true

    # This is the `policy_raw` eval config (IMPLEMENTATION_PLAN.md S3 Phase 7/S4.6, Phase 10's
    # eval matrix): CrowdNavController runs DummyAdapter (Phase 6) with hold-last-action rate
    # handling and an inference-latency watchdog, failing over to a genuinely embedded
    # nav2_mppi_controller::MPPIController (loaded via pluginlib, not reimplemented) on
    # timeout. MPPI's own tuning below is UNCHANGED from when FollowPath was plain MPPI - it's
    # what the embedded fallback_controller_plugin actually reads, under this same
    # `FollowPath.*` namespace (verified against nav2_rotation_shim_controller's real source,
    # which does the same same-name delegation - S4.6). A future `baseline_mppi` eval config
    # (Phase 10) would point FollowPath.plugin straight at nav2_mppi_controller::MPPIController
    # again, in a separate param overlay - not built yet, no mechanism for switching between
    # the three eval configs exists until Phase 10.
    FollowPath:
      plugin: "crowd_nav_controller::CrowdNavController"
      fallback_controller_plugin: "nav2_mppi_controller::MPPIController"
      # Left empty deliberately: nav2_params.yaml is loaded as a raw params file with no
      # launch-substitution preprocessing, so "$(find-pkg-share ...)" would NOT be resolved
      # here (verified against how this project's own launch files pass this file to
      # Node(parameters=[...])) - CrowdNavController resolves a portable default
      # (crowd_nav_policy_adapters's own installed models/dummy_policy.onnx) when this is
      # empty, the same way it does for policy_adapter_config_path.
      onnx_model_path: ""
      # Leaves headroom inside the 0.05s tick period (controller_frequency: 20.0 above) for
      # whatever else the tick does, including Phase 9's supervisor check once it exists
      # (IMPLEMENTATION_PLAN.md S1.7/S4.6).
      watchdog_window_s: 0.03
      # Test-only diagnostic knob (S4.6), 0.0 = inert. Set > 0 only to manually exercise the
      # watchdog/failover path live; never a normal-operation value.
      debug_inject_decision_delay_s: 0.0
      max_linear_vel_mps: 1.0
      min_linear_vel_mps: -0.3
      max_angular_vel_rps: 2.0
      time_steps: 40
      model_dt: 0.05
      batch_size: 1000
      vx_std: 0.2
      vy_std: 0.0
      wz_std: 0.4
      vx_max: 1.0
      vx_min: -0.3
      vy_max: 0.0
      wz_max: 2.0
      ax_max: 1.5
      ax_min: -1.5
      az_max: 3.0
      iteration_count: 1
      prune_distance: 1.5
      transform_tolerance: 0.1
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive"
      visualize: false
      critics:
        [
          "ConstraintCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic",
          "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic",
          "ObstaclesCritic",
        ]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.0
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 3
        threshold_to_consider: 0.5
        offset_from_furthest: 10
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 3.0
        critical_weight: 20.0
        # false: use the costmaps' circular robot_radius for collision checking, matching how
        # the footprint is actually configured below - "true" needs an explicit footprint
        # polygon in the costmap, which we don't set (a circular approximation is a reasonable
        # simplification for this small, roughly-square chassis).
        consider_footprint: false
        collision_cost: 1000000.0
        collision_margin_distance: 0.02
        near_goal_distance: 0.25

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_footprint
      # Rolling window is the actual mitigation for the missing rear hemisphere
      # (IMPLEMENTATION_PLAN.md Phase 2 / docs/phase2-findings.md): cells the sensor can never
      # re-raytrace behind the robot don't get cleared by raytracing, but they DO fall outside
      # this window as the robot moves away, which is what actually bounds the damage. Kept
      # deliberately small (3x3m) relative to the room (~8x4m scaled depot) so stale marks
      # age out of scope quickly rather than accumulating.
      update_frequency: 5.0
      publish_frequency: 2.0
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.03
      # Must match robot_collision_radius in crowd_nav_description/urdf/nvis_3302ard.xacro (single source of truth, diagonal-based - IMPLEMENTATION_PLAN.md S4.3). Update both together.
      robot_radius: 0.14
      # keepout_filter (Phase 3, IMPLEMENTATION_PLAN.md): stock nav2_costmap_2d::KeepoutFilter,
      # fed by crowd_nav_zones' zone_manager node via costmap_filter_info_server + a dedicated
      # map_server instance (crowd_nav_zones/launch/zones.launch.py) - no custom collision
      # logic here, this plugin and its mask pipeline are entirely stock Nav2. Local costmap
      # only, per the phase's own done-bar (matches this project's existing global-costmap
      # design choice above of keeping global static-only).
      plugins: ["obstacle_layer", "inflation_layer", "keepout_filter"]
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: true
        filter_info_topic: /costmap_filter_info
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 0.3
          # obstacle_range/raytrace_range: raytrace_range slightly exceeds obstacle_range so
          # clearing keeps pace with marking along the whole ray, not just up to where
          # something was last seen.
          obstacle_range: 8.0
          raytrace_range: 8.2
          clearing: true
          marking: true
          data_type: "LaserScan"
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # Kept modest deliberately: the scaled depot's clear aisles are ~0.68m
        # (docs/phase0-findings.md) against a ~0.28m robot diameter (radius corrected to 0.14m
        # = the chassis's actual corner-to-center diagonal, not the smaller face-normal half
        # width - a real bug found during Phase 2 testing, see docs/phase2-findings.md) - an
        # inflation_radius much above this starts closing off the aisles Nav2 must navigate.
        inflation_radius: 0.15
        cost_scaling_factor: 3.0
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_footprint
      update_frequency: 2.0
      publish_frequency: 1.0
      resolution: 0.03
      # Must match robot_collision_radius in crowd_nav_description/urdf/nvis_3302ard.xacro (single source of truth, diagonal-based - IMPLEMENTATION_PLAN.md S4.3). Update both together.
      robot_radius: 0.14
      # Static-map-only global costmap (no dynamic obstacle_layer here) is deliberate, not an
      # oversight: it sidesteps the same rear-blind-spot problem entirely at the global level
      # by never marking dynamic scan returns onto a costmap that never rolls/resets.
      #
      # keepout_filter here too, NOT just the local costmap (Phase 3, IMPLEMENTATION_PLAN.md):
      # the phase's original plan text said "local costmap" only, but testing the actual
      # done-bar ("a zone blocks a corridor and MPPI visibly replans") found that local-only
      # doesn't work - NavFn (this costmap's planner) has no idea a zone exists, so it keeps
      # handing MPPI the same path straight through it. MPPI correctly refuses to violate the
      # keepout, "Failed to make progress" fires, a recovery spin runs, and the SAME broken
      # global plan gets computed again - an infinite loop, not a replan, confirmed via
      # ground-truth trajectory logging showing the robot genuinely stuck (not just slow) at
      # the zone boundary. Global awareness is required for an actual detour to exist.
      plugins: ["static_layer", "inflation_layer", "keepout_filter"]
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: true
        filter_info_topic: /costmap_filter_info
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.15
        cost_scaling_factor: 3.0
      always_send_full_costmap: true

map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""

planner_server:
  ros__parameters:
    use_sim_time: true
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      # Matches general_goal_checker's xy_goal_tolerance (controller_server section above) -
      # keep these two in sync, see that comment for why.
      tolerance: 0.35
      use_astar: true
      allow_unknown: true

behavior_server:
  ros__parameters:
    use_sim_time: true
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.5
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.2
    rotational_acc_lim: 2.0

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [1.0, 0.0, 2.0]
    min_velocity: [-0.3, 0.0, -2.0]
    max_accel: [1.5, 0.0, 3.0]
    max_decel: [-1.5, 0.0, -3.0]
    odom_topic: /diff_drive_base_controller/odom
    odom_duration: 0.1

lifecycle_manager:
  ros__parameters:
    use_sim_time: true
    autostart: true
    node_names:
      [
        "map_server", "amcl", "controller_server", "planner_server",
        "behavior_server", "bt_navigator", "velocity_smoother",
      ]
